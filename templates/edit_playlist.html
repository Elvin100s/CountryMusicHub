{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-edit me-2"></i>Edit Playlist</h5>
            </div>
            <form action="{{ url_for('edit_playlist', playlist_id=playlist.id) }}" method="post">
                <div class="card-body">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Name</label>
                        <input type="text" class="form-control form-control-lg" id="name" name="name" value="{{ playlist.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ playlist.description }}</textarea>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="is_public" name="is_public" {% if playlist.is_public %}checked{% endif %}>
                        <label class="form-check-label" for="is_public">Public playlist</label>
                    </div>
                </div>
                <div class="card-footer d-flex justify-content-between bg-light">
                    <a href="{{ url_for('view_playlist', playlist_id=playlist.id) }}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-2"></i>Back</a>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
