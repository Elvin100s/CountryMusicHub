services:
  - type: web
    name: country-music-hub
    env: python
    buildCommand: |
      python3.10 -m venv .venv
      . .venv/bin/activate
      pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: country-music-db
    databaseName: country_music
    user: country_music_user
    plan: free 